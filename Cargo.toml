[package]
name = "lance-hdfs-provider"
version = "0.2.0"
edition = "2024"
authors = ["Guoli Lyu <guoli-lv@hotmail.com>"]
readme = "README.md"
license = "MIT"
description = "HDFS store provider for lance"
repository = "https://github.com/fMeow/lance-hdfs-provider"
documentation = "https://docs.rs/lance-hdfs-provider"
keywords = ["lance", "hdfs", "object-store", "lance-db"]

[dependencies]
async-trait = "0.1"
url = "2"
snafu = "0.8"
bytes = "1"
futures = "0.3"
object_store = { version = "0.12", default-features = false }
opendal = { version = "0.55", features = ["services-hdfs"] }
object_store_opendal = "0.55"
send_wrapper = { version = "0.6", features = ["futures"] }

lance = { version = "2", default-features = false }
lance-core = { version = "2", default-features = false }
lance-io = { version = "2", default-features = false }

[dev-dependencies]
arrow = "57"
tokio = { version = "1", features = ["full"] }
lancedb = { version = "0.26", default-features = false }
